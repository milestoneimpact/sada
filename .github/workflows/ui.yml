name: ui

# ‏بوّابةُ الواجهة (D-326): `npm run audit` (تُرسَم الشاشاتُ وتُدقَّق: الوصولُ والسلّمُ والجوّالُ والزرُّ الأوّليُّ والنصُّ والوزن)
# ‏ثمّ `npm run journeys` (تُقاد الرحلاتُ على نسخةٍ محلّيّة بـChromium وتُقارَن بعتباتها في scripts/journeys/thresholds.json —
# ‏فرحلةٌ تخسر نجاحَها أو تزيد خطوةً أو تحميلًا تُسقط الطلب). كانتا تُشغَّلان محلّيًّا وحدَهما وتُقالان في نصّ الطلب،
# ‏فسقطت رحلتان منذ D-289 ولم يرهما أحد حتّى D-293.
#
# ‏ودقائق GitHub تقاس ولا تقدر (CLAUDE.md): على طلبات الدمج الجاهزة وحدها (المسوّدةُ تتخطّى، كـ ci.yml)، وحين يمسّ الطلبُ ما تقيسه
# ‏الرحلات (المرشّحُ أدناه)، والدفعةُ الجديدةُ على الطلب تلغي الجاري. **وهي أثقلُ بوّابة**، ومكوّناتُها مقيسةٌ محلّيًّا على أربع أنويةٍ
# ‏يتقاسمها وكلاءُ آخرون (D-326 ومراجعتُه): التدقيقُ ‏28.4 إلى ‏29.0 دقيقةً ساعةً في ثلاثة تشغيلات (‏11.9 إلى ‏12.3 دقيقةَ معالج: جُلُّه
# ‏انتظارُ المتصفّح لا حساب، فعدّاءٌ بأنويةٍ لا يتقاسمها أحدٌ لا يقصّره كثيرًا)، والرحلاتُ ‏3.4 إلى ‏4.1، وفوقهما `npm ci` وChromium بمكتباته
# ‏نحو ‏3 — **فالمقيسُ نحو ‏35 إلى ‏36 دقيقةً للتشغيل الواحد**، يُضاف إليها عبءُ العدّاء نفسِه، ولا حدَّ أدنى بلا قياس. والرقمُ يُصحَّح من
# ‏أوّل تشغيلٍ حقيقيّ على GitHub (ومعه `timeout-minutes`). ولا push على main: الطلبُ قِيس قبل الدمج.
#
# ‏**ولا يُجعل فحصًا مشروطًا للدمج**: سيرٌ بمرشّح مسارات لا يجري على طلبٍ لا يمسّها، والفحصُ المشروطُ الغائبُ يُبقي الطلبَ
# ‏«ينتظر» إلى الأبد. البوّابةُ المشروطة `ci` وحدَها (M-43).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # ‏الخادمُ يُقلع العاملَ كلَّه، فكلُّ مسارٍ وعرضٍ في `src/routes` (الدخولُ بعاملَيه في `auth.ts` و`authView.ts`، وOAuth، واللوحة)
    # ‏وما ترسمه الرئيسيّةُ من `lib` (قائمةُ البدء و«خطوتك التالية» وحالُ المنصّات) والاعتماديّاتُ — والاختباراتُ وحدَها لا تُشغِّله
    # ‏(مراجعة D-326: كان طلبٌ يمسّ `auth.ts` وحدَه يُدمج ولم تُقَس ر-11·رمز). و`gate.ts` يشترط أن يُمسك هذا المرشّحُ كلَّ ملفٍّ في
    # ‏`src/routes` وقائمةَ `UI_SURFACES`، فلا يُنسى مسارٌ جديد.
    paths:
      - 'src/routes/**'
      - 'src/lib/home.ts'
      - 'src/lib/channels.ts'
      - 'src/lib/nav/**'
      - 'src/lib/security/**'
      - 'src/lib/ui/**'
      - '!src/**/*.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/audit_*'
      - 'scripts/journeys/**'
      - 'scripts/render_*.ts'
      - 'scripts/screens.mjs'
      - '.github/workflows/ui.yml'
  workflow_dispatch:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    # ‏ولا على طلبات Dependabot (دمجُ D-326): تمسّ `package.json` فيطابقها المرشّح، وDependabot يعيد بناءها حين يتقدّم main —
    # ‏قِيس بعد دمج D-325: أعاد بناءَ طلبين من ستّة (#239 و#240) في ثلاث دقائق، فجرى `ci` على كلٍّ. ولو جرت هذه معه لزاد كلُّ
    # ‏دمجٍ نحو ‏35 دقيقةً لكلّ طلبٍ أُعيد بناؤه. ويُشغِّلها المالكُ على أحدها بيده (`workflow_dispatch` على فرعه) قبل أن يدمجه.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    # ‏كانت ‏45 والمقيسُ ‏43:16 (D-326)؛ وتشغيلُ #248 أُلغي عند ‏45:04 قبل أن ينتهي — مهلةٌ على دقيقتين من المقيس تُسقط الناجح (D-329)
    timeout-minutes: 60
    steps:
      # ‏بمعرّف التزامٍ كامل لا بوسمٍ يتحرّك، كما في ci.yml (D-319)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # ‏Chromium الذي يطلبه Playwright المثبَّت نفسُه (بمكتباته)، في المسار الذي تفتحه المدقّقاتُ والرحلات
      # ‏(`/opt/pw-browsers/chromium`، و`CHROMIUM_PATH` للرحلات)
      - name: Chromium
        run: |
          sudo mkdir -p /opt/pw-browsers
          sudo chown "$USER" /opt/pw-browsers
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright install --with-deps chromium
          ln -sf "$(PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers node -e "import('playwright').then((m) => console.log(m.chromium.executablePath()))")" /opt/pw-browsers/chromium
          /opt/pw-browsers/chromium --version

      - name: التدقيق
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: npm run audit

      - name: الرحلات
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: npm run journeys -- --out "$RUNNER_TEMP/sada-journeys"

      # ‏الخلاصةُ في صفحة التشغيل نفسِها — نجحت الرحلاتُ أو سقطت
      - name: الخلاصة
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/sada-journeys/SUMMARY.md" ]; then
            cat "$RUNNER_TEMP/sada-journeys/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          fi
