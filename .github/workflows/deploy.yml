name: deploy

# النشر لا يبدأ إلا ببوابة خضراء، والترحيل قبل الدالة دائما (CLAUDE.md).
#
# staging: تلقائي على كل دمج في main.
# production: يدوي وحده، وعبر بيئة GitHub محمية توجب موافقة بشرية —
#             لا نشر إنتاج بضغطة سهو.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: البيئة المستهدفة
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      TARGET: ${{ github.event.inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # البوابة نفسها التي يشغلها المطور محليا. لا نشر على شيفرة لم تمر
      - name: البوابة
        run: npm run ci

      # يفشل مبكرا برسالة مفهومة بدل أن يفشل wrangler برسالة غامضة.
      #
      # الوجود وحده لا يكفي: النشر الثاني سقط على معرّف حساب صحيح القيمة
      # فاسد الشكل، ورسالة wrangler عنه تعرض `***` لأن GitHub يقنّع السر —
      # فلا يعرف القارئ ما العلّة. فيُفحص الشكل هنا حيث تُقال العلّة بلغة
      # تُقرأ، قبل أن تُنفَق دقيقة على ترحيل لن يبدأ.
      - name: التحقق من الأسرار
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN غير مضبوط في أسرار المستودع."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID غير مضبوط في أسرار المستودع."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "::error::Settings ← Secrets and variables ← Actions ← New repository secret"
            exit 1
          fi

          # مسافةٌ أو سطرٌ جديد في نهاية اللصق عطلٌ شائع لا يستحقّ دورة نشر:
          # يُقلَّم هنا، ويُقنَّع الناتج قبل أن يبلغ أيّ سجلّ — فالقيمة
          # المقلَّمة تخالف السرّ المسجَّل لدى GitHub فلا يقنّعها تلقائيا.
          raw_len=${#CLOUDFLARE_ACCOUNT_ID}
          account=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          if [ -n "$account" ]; then echo "::add-mask::$account"; fi
          len=${#account}

          if [ "$len" -eq 0 ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID مسافاتٌ لا قيمة فيها."
            exit 1
          fi
          if [ "$len" -ne "$raw_len" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID كان يحمل مسافةً أو سطرا جديدا — قُلِّم هنا، وصوابه أن يُصحَّح في السرّ نفسه."
          fi

          # قاعدة wrangler نفسها: حرفٌ أو رقمٌ أو شرطةٌ أو شرطةٌ سفليّة لا غير.
          case "$account" in
            *[!A-Za-z0-9_-]*)
              echo "::error::CLOUDFLARE_ACCOUNT_ID يحمل محارف لا يقبلها wrangler."
              echo "::error::القيمة معرّف الحساب وحده: لا https:// ولا شرطة مائلة ولا رابط كامل."
              echo "::error::تجده في عنوان اللوحة بعد أوّل شرطة مائلة: dash.cloudflare.com/<المعرّف>"
              echo "::error::طوله الآن $len محرفا، والمتوقّع 32 من ستّ عشريّ."
              exit 1
              ;;
          esac
          if [ "$len" -ne 32 ]; then
            echo "::warning::طول CLOUDFLARE_ACCOUNT_ID $len لا 32 — تحقّق أنّه المعرّف كاملا لا جزءا منه."
          fi

          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          echo "السرّان حاضران، وشكل معرّف الحساب سليم."

      # الترحيل قبل الدالة (CLAUDE.md): Worker يقرأ عمودا لم يُضَف ينكسر
      # على منشور مجدول. والترتيب هنا هو الترتيب نفسه في الوثيقة
      # لا علم تأكيد هنا: wrangler لا يقبل -y ولا --yes على هذا الأمر
      # (جُرّب، فردّ Unknown argument). ومساعدته تنص أن التأكيد يُتخطى
      # تلقائيا في بيئة CI غير التفاعلية — فلا حاجة إليه أصلا.
      # و 0001_init طُبِّق يدويا عبر API وسُجِّل في d1_migrations، فلا يُعاد.
      - name: الترحيل
        run: npx wrangler d1 migrations apply "$([ "$TARGET" = production ] && echo sada || echo sada-staging)" --env "$TARGET" --remote

      # ولا --yes هنا: جُرّب فردّ Unknown argument: yes.
      # الاستئذان قبل دهس Worker أُنشئ من اللوحة — و sada-api-staging منها —
      # يُتخطى في CI بغياب طرفية تفاعلية. فإن توقف النشر منتظرا جوابا،
      # فالمهلة هي ما يكشفه، والعلاج CI=true لا علم غير موجود.
      - name: النشر
        run: npx wrangler deploy --env "$TARGET"

      # لا نقول إن النشر نجح حتى يقول الخادم إنه نجح.
      # لكن غياب النطاق ليس فشل نشر: يُجرَّب النطاق، فإن لم يستجب أصلا
      # جُرِّب عنوان workers.dev. الفشل الحقيقي أن يستجيب ولا يكون جاهزا.
      - name: التحقق من الجاهزية
        run: |
          BASE=$([ "$TARGET" = production ] && echo https://sada.basserh.com || echo https://sada2.basserh.com)
          probe() {
            for i in 1 2 3 4 5; do
              CODE=$(curl -s -o /tmp/ready.json -w '%{http_code}' --max-time 15 "$1/ready" || echo 000)
              echo "  $1 → HTTP $CODE"
              [ "$CODE" != 000 ] && { cat /tmp/ready.json; echo; return 0; }
              sleep 6
            done
            return 1
          }

          echo "فحص النطاق المخصص"
          if probe "$BASE"; then
            grep -q '"ready":true' /tmp/ready.json && exit 0
            echo "::error::النطاق يستجيب لكن النظام ليس جاهزا. الناقص مذكور أعلاه بالاسم."
            exit 1
          fi

          echo "::warning::$BASE لا يستجيب — النطاق لم يُربط بعد (M-05)."
          DEV=$(npx wrangler deployments list --env "$TARGET" 2>/dev/null | grep -om1 'https://[a-z0-9.-]*workers\.dev' || true)
          if [ -z "$DEV" ]; then
            echo "::warning::تعذّر استنتاج عنوان workers.dev. النشر تمّ، والتحقق مؤجل."
            exit 0
          fi
          echo "فحص عنوان workers.dev"
          if probe "$DEV"; then
            grep -q '"ready":true' /tmp/ready.json && exit 0
            echo "::error::الخادم يستجيب وليس جاهزا. الناقص مذكور أعلاه بالاسم."
            exit 1
          fi
          echo "::error::لا النطاق ولا workers.dev استجابا. النشر مشكوك فيه."
          exit 1
