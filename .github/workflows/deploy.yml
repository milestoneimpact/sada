name: deploy

# النشر لا يبدأ إلا ببوابة خضراء، والترحيل قبل الدالة دائما (CLAUDE.md).
#
# staging: تلقائي على كل دمج في main.
# production: يدوي وحده، وعبر بيئة GitHub محمية توجب موافقة بشرية —
#             لا نشر إنتاج بضغطة سهو.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: البيئة المستهدفة
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      TARGET: ${{ github.event.inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # البوابة نفسها التي يشغلها المطور محليا. لا نشر على شيفرة لم تمر
      - name: البوابة
        run: npm run ci

      # يفشل مبكرا برسالة مفهومة بدل أن يفشل wrangler برسالة غامضة
      - name: التحقق من وجود السر
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN غير مضبوط في أسرار المستودع."
            echo "::error::Settings ← Secrets and variables ← Actions ← New repository secret"
            exit 1
          fi

      # الترحيل قبل الدالة (CLAUDE.md): Worker يقرأ عمودا لم يُضَف ينكسر
      # على منشور مجدول. والترتيب هنا هو الترتيب نفسه في الوثيقة
      - name: الترحيل
        run: npx wrangler d1 migrations apply "$([ "$TARGET" = production ] && echo sada || echo sada-staging)" --env "$TARGET" --remote

      - name: النشر
        run: npx wrangler deploy --env "$TARGET"

      # لا نقول إن النشر نجح حتى يقول الخادم إنه نجح.
      # /ready يرد 503 ما دام سر ناقصا، ويسمي الناقص بلا قيمته
      - name: التحقق من الجاهزية
        run: |
          BASE=$([ "$TARGET" = production ] && echo https://sada.basserh.com || echo https://sada2.basserh.com)
          echo "فحص $BASE/ready"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/ready.json -w '%{http_code}' "$BASE/ready" || echo 000)
            echo "المحاولة $i → HTTP $CODE"
            cat /tmp/ready.json 2>/dev/null || true; echo
            [ "$CODE" = 200 ] && exit 0
            sleep 10
          done
          echo "::warning::لم يرد /ready بـ 200. النشر تم، لكن النظام ليس جاهزا."
          echo "::warning::الأسباب المتوقعة: سر ناقص، أو النطاق لم يُربط بعد (M-05)."
          exit 1
