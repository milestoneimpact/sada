name: deploy

# النشر لا يبدأ إلا ببوابة خضراء، والترحيل قبل الدالة دائما (CLAUDE.md).
#
# staging: تلقائيٌّ **بعد أن ينجح `ci` على الالتزام نفسِه** في main (D-319).
# production: يدويٌّ وحده (Run workflow)، وعبر بيئة GitHub اسمُها `production`: ما يضبطه المالكُ عليها
#             (موافقون، وفروعٌ يُنشَر منها، وسرٌّ للبيئة وحدها) يحرس كلَّ نشرٍ إليها — M-44.
#
# ‏**ولا تُعاد البوّابةُ هنا** (D-319): كان هذا السيرُ يُطلَق مع `ci` على كلّ دفعةٍ ويعيد `npm run ci` كاملًا على الالتزام
# ‏الذي يفحصه `ci` في اللحظة نفسِها — ‏150 ثانيةً من ‏194 (وسيطُ آخر عشرة)، وأربعُ دقائقَ مفوترةٌ لكلّ دمجٍ بدل دقيقة، والدقائقُ
# ‏نفدت ثلاثَ مرّات (M-23). فصار يُطلَق حين يكتمل `ci` (`workflow_run`)، ويسأل GitHub عن نجاحه على الالتزام قبل أيّ خطوة،
# ‏والبوّابةُ تجري هنا احتياطًا حين لا تشغيلَ لـ`ci` عليه أصلًا (نشرٌ يدويٌّ لالتزامٍ لم يمرّ به).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: البيئة المستهدفة
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

# ‏`actions: read` لسؤال GitHub عن تشغيلات `ci` على الالتزام (مستودعٌ خاصّ) — ولا كتابةَ لشيء.
permissions:
  contents: read
  actions: read

jobs:
  deploy:
    # ‏ما يُطلَق من `ci`: نجح، على دفعةٍ إلى main في هذا المستودع نفسِه. و`branches: [main]` وحده لا يكفي: طلبُ دمجٍ من نسخةٍ
    # ‏فرعُها اسمُه main يُطابقه — فالحدثُ `push` والمستودعُ هذا شرطان معه.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'staging' }}
    env:
      TARGET: ${{ inputs.environment || 'staging' }}
      # ‏الالتزامُ الذي فحصه `ci` — لا رأسُ main ساعةَ الإطلاق، وقد يكون تقدّم بدفعةٍ بعده
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # ‏**ولا `CLOUDFLARE_API_TOKEN` هنا** (D-319): كان على مستوى العمل، فيراه `npm ci` بسكربتات تثبيته، وسلسلةُ الاختبار كلُّها.
      # ‏صار على الخطوات الثلاث التي تكلّم Cloudflare وحدها: الترحيل والطوابير والنشر. ومعرّفُ الحساب في wrangler.toml لا هنا:
      # ‏متغيّرُ البيئة يغلب الملفّ، فقيمةٌ فاسدة فيه تُبطل الملفّ الصحيح.
    steps:
      # ‏كلُّ إجراءٍ بمعرّف التزامٍ كامل لا بوسم (D-319): الوسمُ يتحرّك، ومن ملكه غيّر ما يجري هنا بلا أن يتغيّر سطرٌ في المستودع.
      # ‏والإصدارُ في التعليق يقرؤه Dependabot فيرفع الاثنين معا.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      # ‏قبل التثبيت: لا يحتاج إلّا node، والحكمُ يقرّر هل تجري البوّابةُ هنا. ينتظر `ci` إن كان جاريًا (نشرٌ يدويّ)، ويرفض إن سقط.
      - name: بوّابة ci على هذا الالتزام
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy_checks.mjs ci-gate "$GITHUB_REPOSITORY" "$SHA"

      # ‏بلا سكربتات التثبيت (D-319): ثلاثةُ حزمٍ فيها سكربت (esbuild وworkerd وfsevents)، وwrangler يبني ويرفع بدونها —
      # ‏جُرّب: `wrangler deploy --dry-run` يُخرج الحزمةَ نفسَها بايتًا ببايت، و`npm run ci` كاملًا أخضر. فما يُثبَّت لا يجري فيه شيء.
      - run: npm ci --ignore-scripts

      # ‏الاحتياطُ وحده: لا تشغيلَ مكتملًا لـ`ci` على هذا الالتزام. مرآةُ ci.yml بخطوتيه
      - name: البوابة (لا ci على هذا الالتزام)
        if: steps.ci.outputs.gate == 'run'
        run: |
          npm audit --omit=dev --audit-level=high
          npm run ci

      # يفشل مبكرا برسالة مفهومة بدل أن يفشل wrangler برسالة غامضة.
      # ‏ولا يرى الرمزَ نفسَه (D-319): يرى «أهو مضبوط» نعم أو لا.
      - name: التحقّق من الرمز
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::error::CLOUDFLARE_API_TOKEN غير مضبوط لبيئة $TARGET."
            echo "::error::Settings ← Environments ← $TARGET ← Environment secrets (M-44)، أو Secrets and variables ← Actions (M-10)"
            exit 1
          fi
          echo "الرمز حاضر. ومعرّف الحساب من wrangler.toml."

      # ‏معرّفاتُ الإنتاج حقيقيّةٌ منذ 2026-10-20؛ والحارسُ باقٍ لمن يعيد PLACEHOLDER إلى الملفّ.
      #
      # ‏وبدونه يسقط النشر **في عمق wrangler برسالةٍ لا تدلّ**:
      #
      #   A request to the Cloudflare API (/d1/database/PLACEHOLDER_D1_PRODUCTION_ID/query)
      #   Invalid property: databaseId => Invalid uuid [code: 7400]
      #
      # فيقرؤها المالك فيظنّ العطلَ عابراً، **ويعيد التشغيل على staging
      # فيخضرّ** — فيحسب الإنتاجَ منشوراً وهو لم يُنشَر قطّ. وقد وقع.
      - name: التحقّق من معرّفات البيئة
        if: env.TARGET == 'production'
        run: |
          if grep -q 'PLACEHOLDER_' wrangler.toml; then
            echo "::error::معرّفات الإنتاج في wrangler.toml ما تزال PLACEHOLDER — والإنتاج لا يُنشَر بها."
            echo "::error::الناقص:"
            grep -n 'PLACEHOLDER_' wrangler.toml | sed 's/^/::error::  /'
            echo "::error::أنشئ الموارد ثم ضع معرّفاتها (M-05 · docs/MANUAL-TASKS.md):"
            echo "::error::  npx wrangler d1 create sada"
            echo "::error::  npx wrangler kv namespace create SADA_KV_PRODUCTION"
            exit 1
          fi
          echo "معرّفات الإنتاج مضبوطة."

      # الترحيل قبل الدالة (CLAUDE.md): Worker يقرأ عمودا لم يُضَف ينكسر
      # على منشور مجدول. والترتيب هنا هو الترتيب نفسه في الوثيقة
      # لا علم تأكيد هنا: wrangler لا يقبل -y ولا --yes على هذا الأمر
      # (جُرّب، فردّ Unknown argument). ومساعدته تنص أن التأكيد يُتخطى
      # تلقائيا في بيئة CI غير التفاعلية — فلا حاجة إليه أصلا.
      # و 0001_init طُبِّق يدويا عبر API وسُجِّل في d1_migrations، فلا يُعاد.
      - name: الترحيل
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply "$([ "$TARGET" = production ] && echo sada || echo sada-staging)" --env "$TARGET" --remote

      # ولا --yes هنا: جُرّب فردّ Unknown argument: yes.
      # الاستئذان قبل دهس Worker أُنشئ من اللوحة — و sada-api-staging منها —
      # يُتخطى في CI بغياب طرفية تفاعلية. فإن توقف النشر منتظرا جوابا،
      # فالمهلة هي ما يكشفه، والعلاج CI=true لا علم غير موجود.
      # طوابيرُ الإنتاج تُنشأ إن غابت، فلا أداةَ لها في اللوحة الموصولة.
      # والأمرُ لا يُعاد على طابورٍ قائم: يُسأل عنه أوّلاً.
      # ‏وفي البيئتين (D-269): طابورُ أعطال التوليد جديدٌ على staging أيضا، ونشرٌ
      # ‏يسمّي طابورا لا وجودَ له يُردّ قبل أن يبدأ.
      - name: الطوابير
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          suffix="$([ "$TARGET" = production ] && echo "" || echo "-staging")"
          for q in sada-publish sada-generate sada-publish-dlq sada-generate-dlq; do
            if npx wrangler queues info "$q$suffix" >/dev/null 2>&1; then
              echo "قائم: $q$suffix"
            else
              npx wrangler queues create "$q$suffix"
            fi
          done

      # ‏ومعرّفُ النسخة من ملفّ مخرَج wrangler (D-319) لا من نصٍّ مطبوع: هو ما يقوله `/ready` بعدُ إن كانت هي المخدومة.
      # ‏والالتزامُ رسالةُ النسخة، فتُقرأ في لوحة Cloudflare (Deployments) أيُّ شيفرةٍ هي.
      - name: النشر
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson
        run: |
          npx wrangler deploy --env "$TARGET" --message "$SHA"
          VERSION=$(node scripts/deploy_checks.mjs deployed "$WRANGLER_OUTPUT_FILE_PATH")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "نُشرت النسخة $VERSION من الالتزام $SHA على $TARGET."
          echo "النسخة \`$VERSION\` ← الالتزام \`$SHA\` ← \`$TARGET\`" >> "$GITHUB_STEP_SUMMARY"

      # لا نقول إنّ النشر نجح حتّى يقول الخادم إنّه نجح.
      #
      # لكنّ البوّابة تحاسب على ما يخصّ النشر وحده، لا على ما يخصّ حسابات
      # المالك. أسرار LinkedIn و X تنتظر موافقاتٍ تستغرق أيّاماً؛ ولو بقي
      # كلّ نشرٍ أحمر طوالها لصار الأحمر عادةً تُتجاهَل — وحين يقع عطلٌ
      # حقيقيّ لا يميّزه أحد. فالأسرار الناقصة **تحذير**، وتُذكر بأسمائها.
      #
      # وما يُحاسَب عليه النشر أربعة، وكلّها فشلٌ حقيقيّ:
      #   ١ · أن يستجيب **النطاقُ المخصّص** أصلاً — وإلا فالنشر لم يهبط
      #   ٢ · أن يكون الرادّ صدى لا قالباً — بحقلٍ لا يعرفه غيرها
      #   ٣ · أن تكون القاعدة موصولة       — الربوط والترحيل معاً
      #   ٤ · أن يخدم النسخةَ التي نُشرت للتوّ — لا بناءً قديمًا لم يُستبدَل (D-319)
      # ‏ولا بديلَ workers.dev (D-319): كان يُقبَل حين لا يردّ النطاق، فيخضرّ نشرٌ لا يصل العنوانَ الذي يفتحه المالك وتعود إليه
      # ‏المنصّات. وأُطفئ workers.dev في البيئتين (wrangler.toml)، والإنتاجُ لم يكن له أصلًا.
      - name: التحقّق من النشر
        env:
          DEPLOYED: ${{ steps.deploy.outputs.version }}
        run: |
          BASE=$([ "$TARGET" = production ] && echo https://sada.basserh.com || echo https://sada2.basserh.com)
          probe() {
            for i in 1 2 3 4 5; do
              CODE=$(curl -s -o /tmp/ready.json -w '%{http_code}' --max-time 15 "$1/ready" || echo 000)
              echo "  $1 → HTTP $CODE"
              [ "$CODE" != 000 ] && { cat /tmp/ready.json; echo; return 0; }
              sleep 6
            done
            return 1
          }

          echo "فحص النطاق المخصّص"
          if ! probe "$BASE"; then
            echo "::error::$BASE لا يستجيب. النطاقُ غيرُ مربوطٍ بهذا الـ Worker (M-05 · M-22)، أو النشرُ لم يهبط."
            exit 1
          fi

          # ٢ · الرادّ صدى لا قالب: اسمُ الخدمة في جوابها. وكان `phase_0`، فخرج مع التفصيل
          #     إلى `/admin/ready` خلف كلمة الإدارة (D-318): `/ready` العامّ يقول الحالَ وحدَها
          if ! grep -q '"service":"sada-api"' /tmp/ready.json; then
            echo "::error::الخادم يستجيب لكن جوابه ليس جواب صدى — قالبٌ قديم ما يزال منشوراً؟"
            exit 1
          fi

          # ٣ · القاعدة موصولة: يثبت الربوط والترحيل معاً
          if ! grep -q '"database":"ok"' /tmp/ready.json; then
            echo "::error::صدى منشورة لكنّها لا تصل إلى D1. ربطٌ ناقص أو ترحيلٌ لم يُطبَّق."
            exit 1
          fi

          # ٤ · النطاقُ يخدم النسخةَ التي نُشرت للتوّ (D-319): يسأل حتّى دقيقة، فالانتقالُ على الحافّة ثوانٍ
          node scripts/deploy_checks.mjs wait "$BASE" "$DEPLOYED"

          # ٥ · الوثيقتان العامّتان تفتحان (D-038)
          #
          # هما رابطان تضعهما في مراجعة LinkedIn و Meta، وقيمتُهما في أن
          # يفتحا لغريبٍ بلا جلسة. ومسارٌ ينكسر بعد شهر يسقط الطلبَ صامتاً
          # — فيُقطَع هنا في كلّ نشر لا يُظنّ.
          # **والفحصُ يعيد المحاولةَ كما يعيدها فحصُ الجاهزيّة** (D-124).
          # سقط نشرٌ ناجحٌ لأنّ اتّصالا واحدا انقطع على ملفّ إثباتٍ يفتح
          # بـ٢٠٠ من كلّ مكان: «curl» رمى، و«|| echo 000» لحق بما طبعته
          # «-w» ناقصا فصار «000000». وحارسٌ يسقط على انقطاعٍ عابر
          # يُقرأ أحمرَ ثمّ لا يُقرأ — فخمسُ محاولاتٍ كما في probe، والرمزُ
          # يُقرأ من ملفٍّ لا من مخرَجٍ قد ينقطع في منتصفه.
          fetch() {
            for i in 1 2 3 4 5; do
              if curl -s -o "$2" -w '%{http_code}' --max-time 15 "$1" > /tmp/code.txt 2>/dev/null; then
                CODE=$(cat /tmp/code.txt); return 0
              fi
              sleep 6
            done
            CODE=000; return 1
          }

          for doc in privacy terms; do
            fetch "$BASE/$doc" /tmp/doc.html || true
            echo "  $BASE/$doc → HTTP $CODE"
            if [ "$CODE" != 200 ]; then
              echo "::error::$BASE/$doc لا يفتح ($CODE). ورابطٌ لا يفتح يُسقط مراجعة المنصّة."
              exit 1
            fi
            # ولا يكفي 200: صفحةُ خطأٍ ترد 200 أحياناً
            if ! grep -q 'صدى' /tmp/doc.html; then
              echo "::error::$BASE/$doc يردّ 200 لكنّ محتواه ليس الوثيقة."
              exit 1
            fi
          done

          # ٦ · ملفّاتُ إثبات ملكيّة النطاق تُخدَم حرفا بحرف (D-094)
          #
          # وهي حجّةُ الوثيقتين نفسُها: رابطٌ لا يفتح يُسقط مراجعةَ
          # المنصّة صامتاً. **والأسماءُ تُقرأ من السجلّ لا تُكتب هنا** —
          # قائمتان تفترقان، فتُحرَس واحدةٌ ويُنسى ما زيد على الأخرى.
          NAMES=$(grep -o "file: '[^']*'" src/routes/verify.ts | sed "s/file: '//; s/'$//")
          if [ -z "$NAMES" ]; then
            echo "::error::تعذّرت قراءة أسماء ملفّات الإثبات من src/routes/verify.ts."
            echo "::error::أنُقل الحقل أم أُعيدت تسميته؟ وحارسٌ لا يقرأ لا يحرس."
            exit 1
          fi
          for name in $NAMES; do
            fetch "$BASE/$name" /tmp/vrf.txt || true
            echo "  $BASE/$name → HTTP $CODE"
            if [ "$CODE" != 200 ]; then
              echo "::error::$BASE/$name لا يفتح ($CODE) — ولا تُقبَل مراجعةُ المنصّة بدونه."
              exit 1
            fi
          done

          if grep -q '"ready":true' /tmp/ready.json; then
            echo "النشر تمّ، والنسخةُ المنشورة هي المخدومة، والنظام جاهز."
            exit 0
          fi

          echo "::warning::النشر تمّ وصدى تعمل والقاعدة موصولة — وصدى ليست جاهزةً بعد (أسرارٌ ناقصة)."
          # ‏وأسماؤها لا تُقرأ من `/ready` العامّ بعد D-318: في «ما عليك» باللوحة، أو `/admin/ready` بكلمة الإدارة
          echo "::warning::أسماؤها في «ما عليك» باللوحة، أو: curl -H 'Authorization: Bearer <ADMIN_TOKEN>' $BASE/admin/ready"
          echo "::warning::هذه مهامّ المالك (docs/MANUAL-TASKS.md)، لا عطلٌ في النشر."
