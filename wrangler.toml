# صدى — إعداد Cloudflare
#
# لا سرّ في هذا الملفّ. القيم الحسّاسة تدخل بـ `wrangler secret put` وحدها،
# وأسماؤها موثّقة في docs/ARCHITECTURE.md §١.
#
# مُعرّفات staging حقيقية، أُنشئت في 2026-09-04 وطُبّق عليها الترحيل.
# وهي ليست أسراراً: مُعرّف قاعدة أو مساحة لا يمنح وصولاً بلا مصادقة الحساب.
# ومُعرّفات الإنتاج حقيقيّةٌ كذلك منذ 2026-10-20 (D1 وKV أدناه)، والإنتاجُ مؤجَّلٌ بقرار (D-271 · M-22).

# معرّف الحساب هنا لا في أسرار GitHub: ليس سرّاً — لا يمنح وصولاً بلا رمز
# مصادقة — ولصقه يدوياً في سرّ أسقط نشرين. وقيمة في ملفّ تُراجَع في طلب دمج
# ولا تُلصق فوقها مسافة. الرمز وحده يبقى سرّاً، وهو ما يحرس الحساب فعلاً.
account_id = "46057e337a601e2e6f775105a31bb865"

name = "sada-api"
main = "src/index.ts"
compatibility_date = "2026-09-02"
compatibility_flags = ["nodejs_compat"]

# ── staging ─────────────────────────────────────────────────────────
# النطاق: sada2.basserh.com  (لا يُخلَط بالإنتاج — CLAUDE.md)

[env.staging]
# ‏**أصلٌ واحدٌ عامّ: sada2.basserh.com** (D-319). كان `workers_dev = true` «رابطا يعمل فور النشر قبل ربط النطاق»، والنطاقُ
# ‏مربوطٌ منذ 2026-09، وstaging يحمل حساباتِ المالك الحقيقيّة (D-271): فعنوانُ workers.dev أصلٌ ثانٍ للـ Worker نفسِه لا يمرّ
# ‏بما يُضبَط على النطاق (WAF وحدود المعدّل وAccess)، وفحصُ النشر كان يقبله بديلا فيخضرّ والنطاقُ لا يردّ. فأُطفئ،
# ‏ومعه روابطُ المعاينة لكلّ نسخة (`preview_urls`): بدونها صريحةً يُبقيها wrangler على حالها في الحساب (أصلٌ ثالث).
# ‏ولا يُستعمل أيٌّ منهما في OAuth: روابطُ العودة مسجّلةٌ على sada2.basserh.com وحده.
workers_dev = false
preview_urls = false

# ‏أيُّ نسخةٍ تخدم الطلب (D-319): `/ready` يقول معرّفَها، وسيرُ النشر يقارنه بما نشره للتوّ على النطاق نفسِه.
# ‏والربطُ لا يُورَث من الجذر: يُكتب في كلّ بيئة.
[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.staging.vars]
SADA_ENV = "staging"
PUBLIC_BASE_URL = "https://sada2.basserh.com"
# مجلد «صدى — مصادر». معرّف لا سر: لا يمنح وصولا بلا حساب الخدمة
DRIVE_FOLDER_ID = "1U2UTordK05t6zJ7H_UU4LfcC7bAFFdi2"
# معرّفُ حساب Cloudflare — **متغيّرٌ لا سرّ**: هو في كلّ عنوانٍ يُنادى
# وفي لوحة Cloudflare نفسِها، ولا يمنح وصولا بلا الرمز. والرمزُ
# `CF_AI_TOKEN` في أسرار Worker وحدها (D-005 · D-055). ولم يُوضَع في
# الإنتاج: عملُ Cloudflare كلُّه في staging حتّى الآن، ومتغيّرٌ يُضبَط
# هناك يجعل اللوحة تعرض عنوانا لحسابٍ لا رمزَ له.
CF_AI_ACCOUNT_ID = "c6ea7ba30984d494a1a78efea6ddc9a0"
# جهةُ التشغيل وبريدُ التواصل في `/privacy` و `/terms`.
# متغيّران لا سرّان: كلاهما يُنشر على الصفحة نفسها. وما لم يُضبَط لا
# يُخترَع — بريدٌ لا وجود له في سياسةِ خصوصيّة يُسقط مراجعةَ المنصّة.
LEGAL_ENTITY = ""
LEGAL_CONTACT = ""

# Cron مجاني على الخطة المجانية (5 لكل حساب).
# 03:00 UTC = 06:00 بتوقيت الرياض — قبل أن يبدأ اليوم
[env.staging.triggers]
# دورتان لا واحدة (D-037):
#   */15 — تُرسل ما حلّ موعدُه إلى طابور النشر
#   3 3  — تمسح Drive مرّةً في اليوم (لا عند الصفر: هناك تلتقي مع */15 فيدور التجديدُ مرّتين — D-269)
# ودورةٌ يوميّةٌ وحدها كانت تعني أنّ منشورا موعدُه التاسعة صباحا لا يخرج
# قبل الثالثة فجرا بعده — تأخيرٌ يبلغ اثنتين وعشرين ساعة، و«نُشرت في
# مواعيدها» لا تصحّ معه.
crons = ["*/15 * * * *", "7 * * * *", "3 3 * * *", "14 4 * * 1"]

# ‏السجلّاتُ إلى مكانٍ دائم (D-291): Workers Logs تحفظ كلَّ سطرٍ أيّامًا وتُسأل من اللوحة
# ‏(Workers & Pages ← sada-api-staging ← Logs)، بدل `wrangler tail` الذي يرى اللحظةَ وحدَها.
# ‏والعيّنةُ كاملة: السجلُّ هنا شحيحٌ وموزون، وما يُفقَد منه لا يُستعاد.
[env.staging.observability]
enabled = true
head_sampling_rate = 1

[[env.staging.d1_databases]]
binding = "DB"
database_name = "sada-staging"
database_id = "422cdc81-6485-45cb-9b2e-995b110756a0"
migrations_dir = "migrations"

# رابطُ Workers AI — بلا مفتاح: الحسابُ نفسه هو الإذن ما دام
# النداءُ من داخل Cloudflare (D-050)
[env.staging.ai]
binding = "AI"

# ‏المصغَّرات (D-335): Cloudflare Images يصغّر الصورةَ مرّةً ثمّ تُحفظ في R2. بلا مفتاح، والسقفُ الشهريّ في الشيفرة دون الحدّ المجّانيّ.
# ‏**في staging وحدَه** حتّى يقول المالك إنّها تعمل (M-49) — والإنتاجُ بلا ربطٍ يسلّم الصورةَ الكاملةَ كما كان.
[env.staging.images]
binding = "IMAGES"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "sada-media-staging"

# رمزُ الدخول بالبريد (D-245) — Email Routing على basserh.com.
# **والوجهةُ مقيَّدةٌ بعنوان المالك**: لا يُرسَل إلى غيره ولو أخطأت الشيفرة.
# ويشترط أن يكون العنوانُ «مُتحقَّقًا» في Email Routing (M-31)
# ‏بلا `destination_address` (D-272): يُرسَل إلى أيّ عنوانٍ **مُتحقَّقٍ منه** في Email Routing — المالكُ والمدعوّون (M-33).
# ‏والشيفرةُ لا ترسل إلّا لهم (`whoCanReceive`)، وCloudflare يردّ ما لم يُتحقَّق منه.
[[env.staging.send_email]]
name = "EMAIL"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "7c4ec65867924a869da8c13146745d2a"

[[env.staging.queues.producers]]
binding = "PUBLISH_QUEUE"
queue = "sada-publish-staging"

[[env.staging.queues.producers]]
binding = "GENERATE_QUEUE"
queue = "sada-generate-staging"

# المستهلك: دفعة صغيرة ومحاولات محدودة. المفتاح يمنع التكرار، لكن كل
# محاولة على X تُحاسَب — فلا تُترك المحاولات مفتوحة.
# ‏`retry_delay` (D-320): ما يفلت من الإمساك في الشيفرة (استدعاءٌ قُتل، أو عطلٌ قبل الحلقة) يعيده Cloudflare بعد دقيقة
# ‏لا فورًا — كانت الإعاداتُ الثلاث تُستنفَد في ثوانٍ قبل أن يعود D1. والإعادةُ من الشيفرة تحمل مهلتَها (60/300/900).
# ‏مستهلكا طابورَي الأعطال (D-270): ما استنفد محاولاتَه يُعلَّم `failed` بأثرٍ ويُقَرّ،
# ‏فيراه التنبيهُ واللوحةُ بدل أن يبقى «في الطابور» بلا جواب. ولا إعادةَ هنا.
[[env.staging.queues.consumers]]
queue = "sada-publish-dlq-staging"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 0
retry_delay = 60

[[env.staging.queues.consumers]]
queue = "sada-generate-dlq-staging"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 0
retry_delay = 60

# ‏مستهلكُ طابور التوليد (D-269): كان مُنتَجا بلا مستهلكٍ في الملفّ، فرسائلُ
# ‏التحليل ومسوّداتُ الخطّة لا يعالجها شيءٌ إلّا إن ضُبط من اللوحة بيد.
[[env.staging.queues.consumers]]
queue = "sada-generate-staging"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
retry_delay = 60
dead_letter_queue = "sada-generate-dlq-staging"

[[env.staging.queues.consumers]]
queue = "sada-publish-staging"
# ‏رسالةٌ واحدةٌ لكلّ استدعاء (D-182): حاويةُ Instagram تُستطلَع حتّى خمس دقائق، ودفعةٌ
# من خمسٍ متتابعةٍ تجاوز سقفَ الخمسَ عشرةَ دقيقة فيُقتَل الاستدعاءُ وسطَ رسالة
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
retry_delay = 60
dead_letter_queue = "sada-publish-dlq-staging"

# ── production ──────────────────────────────────────────────────────
# النطاق: sada.basserh.com

[env.production]
workers_dev = false
# ‏ولا روابطَ معاينةٍ لكلّ نسخة: أصلٌ واحدٌ عامّ، sada.basserh.com (D-319)
preview_urls = false

[env.production.version_metadata]
