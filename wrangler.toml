# مواعيدها» لا تصحّ معه.
crons = ["*/15 * * * *", "7 * * * *", "0 3 * * *", "14 4 * * 1"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "sada"
database_id = "e12ed883-f785-43b2-ac37-efa7bc12b7d6"
migrations_dir = "migrations"

# رابطُ Workers AI — بلا مفتاح: الحسابُ نفسه هو الإذن ما دام
# النداءُ من داخل Cloudflare (D-050)
[env.production.ai]
binding = "AI"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "sada-media"

# رمزُ الدخول بالبريد (D-245) — Email Routing على basserh.com.
# **والوجهةُ مقيَّدةٌ بعنوان المالك**: لا يُرسَل إلى غيره ولو أخطأت الشيفرة.
# ويشترط أن يكون العنوانُ «مُتحقَّقًا» في Email Routing (M-31)
# ‏بلا `destination_address` (D-270): يُرسَل إلى أيّ عنوانٍ **مُتحقَّقٍ منه** في Email Routing — المالكُ والمدعوّون (M-33).
# ‏والشيفرةُ لا ترسل إلّا لهم (`whoCanReceive`)، وCloudflare يردّ ما لم يُتحقَّق منه.
[[env.production.send_email]]
name = "EMAIL"

[[env.production.kv_namespaces]]
binding = "KV"
id = "3d649c83fc074853afb5f5fdee7d1fd5"

[[env.production.queues.producers]]
binding = "PUBLISH_QUEUE"
queue = "sada-publish"

[[env.production.queues.producers]]
binding = "GENERATE_QUEUE"
queue = "sada-generate"

[[env.production.queues.consumers]]
queue = "sada-publish"
# ‏رسالةٌ واحدةٌ لكلّ استدعاء (D-182): حاويةُ Instagram تُستطلَع حتّى خمس دقائق، ودفعةٌ
# من خمسٍ متتابعةٍ تجاوز سقفَ الخمسَ عشرةَ دقيقة فيُقتَل الاستدعاءُ وسطَ رسالة
max_batch_size = 1
